<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Hub content feed: a raw, unfiltered radar of external sources by topic.">
  <meta name="theme-color" content="#16130f">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <title>SteamData Explorer — Feed</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500..700&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles/tokens.css">
  <link rel="stylesheet" href="styles/main.css">
</head>
<body>
  <script>
    // Runs synchronously during parsing (before the deferred nav.js reads data-page
    // below) so the correct nav link highlights per ?section= — one HTML file serves
    // 4 sections, so this can't just be a static attribute like every other page.
    document.body.dataset.page = 'feed-' + (new URLSearchParams(location.search).get('section') || '');
  </script>
  <div id="nav-placeholder"></div>

  <main class="container">
    <header class="page-header">
      <h1 class="text-metallic" data-feed-title>Feed</h1>
      <p data-feed-description>Loading&hellip;</p>
    </header>

    <section class="chart-section" data-reveal>
      <div class="news-list"></div>
    </section>
  </main>

  <footer class="site-footer">
    Hub content: a raw feed from external sources, refreshed on a schedule, not curated.
  </footer>

  <script defer src="scripts/nav.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script defer src="scripts/supabase-client.js"></script>
  <script defer src="scripts/data.js"></script>
  <script defer src="scripts/feed.js"></script>
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/gsap.min.js"></script>
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/ScrollTrigger.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/lenis@1.3.24/dist/lenis.min.js"></script>
  <script defer src="scripts/motion.js"></script>
</body>
</html>
