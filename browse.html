<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Browse and sort the full SteamData Explorer dataset by genre, tag, price, tier, and review score.">
  <meta name="theme-color" content="#16130f">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <title>SteamData Explorer — Browse Data</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500..700&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles/tokens.css">
  <link rel="stylesheet" href="styles/main.css">
</head>
<body data-page="browse">
  <div id="nav-placeholder"></div>

  <main class="container">
    <header class="page-header">
      <h1 class="text-metallic">Browse the data</h1>
      <p>
        Every game in this snapshot, filterable and sortable. Switch between a compact
        table and a visual card grid.
      </p>
    </header>

    <section id="filters" data-reveal>
      <input type="search" class="name-search-input filter-panel__search" placeholder="Search by game name&hellip;" aria-label="Search by game name">
      <div class="global-filter-panel"></div>
    </section>

    <section id="data" class="chart-section" data-reveal>
      <div class="data-view-toggle">
        <button type="button" class="chip chip--active" data-view="table">Table view</button>
        <button type="button" class="chip" data-view="cards">Card view</button>
      </div>
      <div class="data-table-view"></div>
      <div class="data-cards-view game-grid" hidden></div>
    </section>
  </main>

  <footer class="site-footer">
    Data pulled from SteamSpy and the Steam Store API &middot; sampled snapshot, not a market survey.
  </footer>

  <script defer src="scripts/nav.js"></script>
  <script defer src="scripts/data.js"></script>
  <script defer src="scripts/cards.js"></script>
  <script defer src="scripts/filters.js"></script>
  <script defer src="scripts/table.js"></script>
  <script defer src="scripts/browse.js"></script>
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/gsap.min.js"></script>
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/ScrollTrigger.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/lenis@1.3.24/dist/lenis.min.js"></script>
  <script defer src="scripts/motion.js"></script>
</body>
</html>
