<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SteamData Explorer &mdash; Browse by Genre</title>
  <link rel="stylesheet" href="styles/tokens.css">
  <link rel="stylesheet" href="styles/main.css">
</head>
<body data-page="genre">
  <div id="nav-placeholder"></div>

  <main class="container">
    <header class="page-header">
      <h1>Browse by Genre</h1>
      <p>Click a genre to filter the sample. Click it again to clear the filter.</p>
    </header>

    <div id="chip-row" class="chip-row"></div>

    <section id="genre-stats" class="stat-tiles"></section>

    <section id="game-grid" class="game-grid"></section>
  </main>

  <footer class="site-footer">
    Data pulled from SteamSpy and the Steam Store API &middot; prototype sample, not a market survey.
  </footer>

  <script src="scripts/nav.js"></script>
  <script src="scripts/data.js"></script>
  <script src="scripts/cards.js"></script>
  <script src="scripts/genre.js"></script>
</body>
</html>
